name: Server.Intact.RunScript
author: Intact.AI
description: |
  Fetch a script from a URL on the SERVER and start a hunt that runs it on the
  endpoints with Generic.Intact.RunScript (which must be installed too).

  * Endpoints never contact the URL: the script travels inside the hunt with
    its SHA-256, and each endpoint checks the two still match before running.
  * github.com / www.github.com blob and raw links become their
    raw.githubusercontent.com form. A URL that returns a web page instead of a
    script is refused.
  * TargetOS defaults from the extension: .ps1 -> windows, .sh -> linux.
  * IncludeLabels / ExcludeLabels limit the endpoints. Velociraptor drops label
    conditions when an OS condition is also set, so with labels the OS is
    checked by each endpoint instead (others report Status=Skipped).
  * GitHubToken reads a private repository. It is sent only to GitHub hosts and
    never written to the hunt or the log, but like every collection parameter
    it is visible in this collection's request: use a read-only token.
  * The URL (without its query string), the SHA-256 and the size are logged and
    stored in the hunt description: the hunt records exactly what it ran.
  * Result is HuntStarted, HuntFailed (Velociraptor refused the hunt; see the
    log) or NotStarted (a problem before that; see Problem).

type: SERVER

required_permissions:
  - START_HUNT

parameters:
  - name: ScriptURL
    description: The script to run (https URL, or a github.com blob/raw link).
  - name: TargetOS
    description: windows or linux. Empty = from the file extension.
  - name: TimeoutSec
    description: Kill the script on an endpoint after this many seconds.
    type: int
    default: "600"
  - name: ExpiryDays
    description: How long offline endpoints can still pick the hunt up (1 or more).
    type: int
    default: "7"
  - name: MaxFileMB
    description: "Per output file: larger files are listed, not uploaded."
    type: int
    default: "100"
  - name: IncludeLabels
    description: Only endpoints with these labels (comma separated).
  - name: ExcludeLabels
    description: Skip endpoints with these labels (comma separated).
  - name: StartPaused
    description: Create the hunt paused, to review it before it runs.
    type: bool
  - name: GitHubToken
    description: Read-only token for a private GitHub repository (sent to GitHub hosts only).

sources:
  - query: |
      LET MaxScriptBytes <= 1048576

      LET Trimmed <= regex_replace(source=ScriptURL || '', re='^\\s+|\\s+$', replace='')
      LET RawURL <= regex_replace(source=Trimmed,
          re='^https?://(?:www\\.)?github\\.com/([^/]+)/([^/]+)/(?:blob|raw)/(.+)$',
          replace='https://raw.githubusercontent.com/$1/$2/$3')
      -- What is recorded: no query string or fragment (a private "raw" link
      -- carries ?token=... there).
      LET CleanURL <= regex_replace(source=RawURL, re='[?#].*$', replace='')
      LET FileName <= regex_replace(source=CleanURL, re='^.*/', replace='')
      LET OSFromName <= if(condition=FileName =~ '(?i)\\.ps1$', then='windows',
                        else=if(condition=FileName =~ '(?i)\\.(sh|bash)$', then='linux', else=''))
      LET OS <= lowcase(string=TargetOS || OSFromName)
      LET ToGitHub <= RawURL =~ '^https://([a-z0-9-]+\\.)*(github\\.com|githubusercontent\\.com)/'

      LET Fetched <= SELECT Response, Content FROM http_client(url=RawURL,
          headers=if(condition=GitHubToken AND ToGitHub,
                     then=dict(Authorization='token ' + GitHubToken), else=dict()))
      LET Status <= Fetched[0].Response
      LET Script <= Fetched[0].Content || ''
      LET SHA256 <= hash(path=Script, accessor='data').SHA256

      LET Problem <= if(condition=NOT Trimmed, then='ScriptURL is empty',
          else=if(condition=NOT Trimmed =~ '^https?://', then='ScriptURL must start with http:// or https://',
          else=if(condition=Status != 200, then=format(format='download failed: HTTP %v from %v', args=[Status, CleanURL]),
          else=if(condition=NOT Script, then='the downloaded script is empty',
          else=if(condition=Script =~ '(?is)^\\s*(<!doctype html|<html)',
                  then='the URL returned a web page, not a script: use the file\'s Raw link',
          else=if(condition=len(list=Script) > MaxScriptBytes, then='the script is over 1 MB',
          else=if(condition=NOT OS in ('windows', 'linux'),
                  then=format(format='cannot tell the target OS from "%v": set TargetOS to windows or linux', args=FileName),
          else=if(condition=ExpiryDays < 1, then='ExpiryDays must be 1 or more',
          else=''))))))))

      LET _Log1 <= log(message='Intact.RunScript: %v -> HTTP %v, %v bytes, sha256 %v, target %v',
                       args=[CleanURL, Status, len(list=Script), SHA256, OS])
      LET _Log2 <= if(condition=Problem,
          then=log(level='ERROR', message='Intact.RunScript: not started: %v', args=Problem))

      -- Trimmed, split, empty entries dropped ("" would match no endpoint).
      LET Labels(S) = filter(list=split(string=regex_replace(source=S || '', re='^\\s+|\\s+$', replace=''),
                                        sep='\\s*,\\s*'),
                             condition='x=>x')
      LET Include <= Labels(S=IncludeLabels)
      LET Exclude <= Labels(S=ExcludeLabels)

      LET Hunt <= if(condition=NOT Problem, then=hunt(
          description=format(format='Intact.RunScript: %v (sha256 %v) from %v',
                             args=[FileName, SHA256, CleanURL]),
          artifacts=['Generic.Intact.RunScript'],
          spec=dict(`Generic.Intact.RunScript`=dict(
              Script=Script, ScriptName=FileName, ScriptURL=CleanURL, ScriptSHA256=SHA256,
              TargetOS=OS, TimeoutSec=str(str=TimeoutSec), MaxFileMB=str(str=MaxFileMB))),
          -- hunt() replaces label conditions with an OS condition: with labels,
          -- the endpoints check the OS themselves (TargetOS above).
          os=if(condition=Include OR Exclude, then='', else=OS),
          expires=now() + ExpiryDays * 86400,
          timeout=TimeoutSec + 300,
          include_labels=Include,
          exclude_labels=Exclude,
          pause=StartPaused))

      LET Result <= if(condition=Problem, then='NotStarted',
          else=if(condition=Hunt.HuntId, then='HuntStarted', else='HuntFailed'))
      LET _Log3 <= if(condition=Result = 'HuntFailed',
          then=log(level='ERROR', message='Intact.RunScript: Velociraptor did not create the hunt (is Generic.Intact.RunScript installed? permissions?)'))

      SELECT Result,
             if(condition=Result = 'HuntFailed',
                then='Velociraptor did not create the hunt: is Generic.Intact.RunScript installed, and may you start hunts?',
                else=Problem) AS Problem,
             Hunt.HuntId AS HuntId, CleanURL AS ScriptURL, FileName AS ScriptName,
             SHA256 AS ScriptSHA256, len(list=Script) AS ScriptBytes, OS AS TargetOS,
             Include AS IncludeLabels, Exclude AS ExcludeLabels,
             TimeoutSec, ExpiryDays, StartPaused
      FROM scope()
