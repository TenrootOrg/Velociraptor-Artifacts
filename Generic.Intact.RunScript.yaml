name: Generic.Intact.RunScript
author: Intact.AI
description: |
  Run a script on endpoints and bring back everything it produced, merged
  across the hunt. Start a hunt of this artifact and give the script either as
  a link or as text:

    ScriptURL  a link to the script; each endpoint downloads it, so endpoints
               need access to that URL. github.com blob links are turned into
               raw links. The extension picks the OS: .ps1 runs on Windows
               endpoints, .sh / .bash on Linux ones; the others report
               Skipped. Any other link (.py, .bat, no file name) is not run
               (NotStarted) unless TargetOS says where to run it.
    Script     the script text itself (no download; endpoints need no internet).
               Set TargetOS when the hunt targets both Windows and Linux.

  * Windows runs it with Windows PowerShell, Linux always with bash (a shebang
    line is ignored; CRLF line ends are converted). The client runs as
    SYSTEM / root, so the script does too.
  * OUTPUT -- to get a merged table, the script must write its results as
    .csv, .json or .jsonl FILES into its current folder, which is also named
    by the INTACT_OUT environment variable (subfolders too):
      PowerShell:  $data | Export-Csv "$env:INTACT_OUT\users.csv" -NoTypeInformation -Encoding UTF8
      bash:        ps -eo pid,user,comm --no-headers | awk '{print $1","$2","$3}' > "$INTACT_OUT/processes.csv"
    Those files are parsed into rows (UTF-8 with or without BOM, or UTF-16 LE
    with BOM as Windows PowerShell writes it; JSON Lines in a .json file too),
    so the hunt shows one merged table of every endpoint's rows. Files written
    anywhere else (C:\Temp, $env:TEMP, /tmp, ...) are NOT collected.
  * If the script writes no such files -- most public scripts only print to
    the console -- there is no table, but its console output is uploaded as
    intact/stdout.txt and intact/stderr.txt for each endpoint (when not empty).
    Every other file in that folder (txt, evtx, zip, a downloaded tool ...) is
    uploaded as-is too. Every upload, stdout / stderr included, is capped at
    MaxFileMB; bigger files are listed with a Note instead.
  * It never fails silently. Every endpoint returns exactly one
    IntactRow=Execution row, and it comes FIRST, before any upload or parsing
    that could be cut short. Status is one of:
      Success, Failed, TimedOut, Blocked (antivirus / AMSI / execution policy),
      HashMismatch (not run), NotStarted (no script, a failed download, or no
      interpreter -- the Hint says which), Skipped (not the target OS).
    It carries the exit code, timing, the script's SHA-256, a Hint and the
    start of stderr. Problems are also written to the flow log.
  * ScriptSHA256 pins the script: an endpoint refuses to run anything else.
    With ScriptURL this guards against the file at that link changing; a
    plain http:// link is refused without it. Scripts over 10 MB are refused.
  * Processes the script leaves running are killed when it exits on Linux
    (not those it detaches with setsid); on Windows they keep running.
    Only regular files are collected: symbolic links (never followed),
    pipes and sockets in INTACT_OUT are skipped.

  Rows carry an IntactRow column: Execution, File (one per output file, and
  for stdout / stderr) or Row (parsed data; IntactName is the file name,
  IntactFile its path under INTACT_OUT). The hunt notebook opens with four
  cells: "Status per endpoint", "Rows per file", "Merged results" (set
  ShowFile there to see one file's table) and "Uploaded files" (download links).

type: CLIENT

required_permissions:
  - EXECVE

# Temp script, wrapper and output files, and downloading ScriptURL.
# EXECVE already allows far more.
implied_permissions:
  - FILESYSTEM_WRITE
  - NETWORK

# The script has its own timeout (TimeoutSec). Without this, a direct
# collection is cut at Velociraptor's default 600 s -- the same as TimeoutSec --
# and returns no rows at all while the script keeps running. Hunts set their own.
resources:
  timeout: 86400

parameters:
  - name: Script
    description: The script text (PowerShell on Windows, bash on Linux). Or leave empty and give ScriptURL.
  - name: ScriptName
    description: A name for the script, kept in the results.
    default: script
  - name: ScriptURL
    description: |
      A link to the script, used when Script is empty: each endpoint downloads
      it, so it needs access to that URL (github.com blob links work). With
      Script set, this is only recorded. Velociraptor logs every fetch with the
      full URL, so a ?token= or user:password@ in it ends up in each flow's
      log (the results keep only the clean link).
  - name: ScriptSHA256
    description: If set, refuse to run a script whose SHA-256 differs.
  - name: TargetOS
    description: windows or linux; other endpoints report Skipped. Empty = from the ScriptURL extension (.ps1 / .sh).
  - name: TimeoutSec
    description: Kill the script after this many seconds.
    type: int
    default: "600"
  - name: MaxFileMB
    description: Files larger than this are listed but not uploaded or parsed.
    type: int
    default: "100"
  - name: PowerShellExe
    default: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe
  - name: BashExe
    default: /bin/bash

sources:
  - query: |
      -- An emptied or absurd TimeoutSec would mean "no limit" on Linux and
      -- "kill at once" on Windows; it must also stay under resources.timeout.
      LET TimeoutSec <= if(condition=TimeoutSec > 0 AND TimeoutSec <= 82800, then=TimeoutSec, else=600)
      LET OSRows <= SELECT OS FROM info()
      LET OSName <= OSRows[0].OS
      LET IsWin <= OSName = 'windows'
      LET Supported <= OSName in ('windows', 'linux')
      -- ScriptURL: github.com blob/raw links become raw.githubusercontent.com;
      -- what is recorded drops the query string (a private raw link carries
      -- ?token= there). With no TargetOS, the extension decides.
      LET UrlRaw <= regex_replace(source=regex_replace(source=ScriptURL || '', re='^\\s+|\\s+$', replace=''),
          re='^https?://(?:www\\.)?github\\.com/([^/]+)/([^/]+)/(?:blob|raw)/(.+)$',
          replace='https://raw.githubusercontent.com/$1/$2/$3')
      LET UrlClean <= regex_replace(source=regex_replace(source=UrlRaw, re='^([a-zA-Z]+://)[^/@]*@', replace='$1'),
                                    re='[?#].*$', replace='')
      LET UrlName <= regex_replace(source=UrlClean, re='^.*/', replace='')
      LET UrlOS <= if(condition=UrlName =~ '(?i)\\.ps1$', then='windows',
                   else=if(condition=UrlName =~ '(?i)\\.(sh|bash)$', then='linux', else=''))
      LET WantOS <= lowcase(string=TargetOS || if(condition=NOT Script, then=UrlOS, else=''))
      LET RightOS <= NOT WantOS OR WantOS = OSName
      -- A link that is not .ps1 / .sh (a .py, .bat, a gist link with no file
      -- name) would otherwise run as PowerShell AND as bash (seen with .py).
      -- A .ps1 forced onto Linux (or .sh onto Windows) by TargetOS would run in
      -- the wrong interpreter and fail with a confusing parse error.
      LET UrlConflict <= NOT Script AND UrlOS AND TargetOS AND lowcase(string=TargetOS) != UrlOS
      LET UrlTypeOK <= (Script OR TargetOS OR UrlOS OR NOT UrlRaw) AND NOT UrlConflict

      -- Only an endpoint that will run it downloads it; a failure is a status
      -- (NotStarted) with the reason, never a crash.
      LET Download <= if(condition=NOT Script AND UrlRaw AND UrlTypeOK AND Supported AND RightOS,
          then={ SELECT Response, Content FROM http_client(url=UrlRaw, chunk_size=10485761) LIMIT 1 })
      LET DlStatus <= Download[0].Response
      LET DlContent <= Download[0].Content || ''
      LET DlProblem <= if(condition=Script OR NOT UrlRaw OR NOT UrlTypeOK OR NOT Supported OR NOT RightOS, then='',
          else=if(condition=NOT UrlRaw =~ '^https?://', then='ScriptURL must start with http:// or https://',
          else=if(condition=UrlRaw =~ '(?i)^http://' AND NOT ScriptSHA256,
                  then='a plain http:// link can be swapped in transit: use https, or set ScriptSHA256',
          else=if(condition=DlStatus != 200,
                  -- the body helps for a short error ("404: Not Found"), not for a web page
                  then=format(format='download failed: HTTP %v from %v%v', args=[DlStatus, UrlClean,
                      if(condition=DlContent =~ '(?i)<html|<!doctype', then='',
                         else=format(format=' %.150s', args=regex_replace(source=DlContent, re='\\s+', replace=' ')))]),
          else=if(condition=NOT DlContent, then='the downloaded script is empty',
          else=if(condition=DlContent =~ '(?is)^\\s*(<!doctype html|<html)',
                  then='ScriptURL returned a web page, not a script: use the Raw link',
          else=if(condition=len(list=DlContent) > 10485760, then='the downloaded script is over 10 MB',
          else='')))))))
      LET TheScript <= Script || if(condition=NOT DlProblem, then=DlContent, else='')
      LET TheName <= if(condition=ScriptName = 'script' AND NOT Script AND UrlName, then=UrlName, else=ScriptName)
      LET MaxBytes <= MaxFileMB * 1024 * 1024

      -- The approved script, and the text actually written to disk: a BOM already
      -- in the script is dropped (Windows gets exactly one, below) and CRLF line
      -- ends become LF on Linux, where bash would choke on the \r. The hash is
      -- always of the script as sent.
      LET ActualSHA256 <= hash(path=TheScript, accessor='data').SHA256
      LET HashOK <= NOT ScriptSHA256 OR lowcase(string=ScriptSHA256) = ActualSHA256
      LET Body <= regex_replace(source=TheScript, re='^\\x{feff}', replace='')
      LET ScriptText <= if(condition=IsWin, then=unhex(string='efbbbf') + Body,
                           else=regex_replace(source=Body, re='\r\n', replace='\n'))

      LET Runnable <= Supported AND RightOS AND TheScript AND HashOK

      LET OutDir <= tempdir()
      LET WorkDir <= tempdir()
      LET OutDepth <= len(list=pathspec(parse=OutDir).Components)
      LET StdoutPath <= path_join(components=[WorkDir, 'stdout.txt'])
      LET StderrPath <= path_join(components=[WorkDir, 'stderr.txt'])
      LET ScriptPath <= if(condition=Runnable, then=tempfile(data=ScriptText,
          extension=if(condition=IsWin, then='.ps1', else='.sh')))

      -- The wrappers enforce the timeout and send the script's own output to
      -- files, so any size is captured and nothing is lost on a kill.
      -- Windows: cmd.exe redirects at the OS level. PowerShell's own
      -- Start-Process -Redirect* copies through a pipe that a background child
      -- inherits, and the wrapper's wait then hangs on it (measured).
      LET WinWrapper <= if(condition=Runnable AND IsWin, then=tempfile(extension='.ps1', data='''
      param([string]$Script, [string]$StdOut, [string]$StdErr, [int]$TimeoutSec)
      $exe = (Get-Process -Id $PID).Path
      $psi = New-Object System.Diagnostics.ProcessStartInfo
      $psi.FileName = $env:ComSpec
      $psi.Arguments = '/d /s /c ""{0}" -NoProfile -NonInteractive -ExecutionPolicy Bypass -File "{1}" <NUL >"{2}" 2>"{3}""' -f $exe, $Script, $StdOut, $StdErr
      $psi.UseShellExecute = $false
      $psi.CreateNoWindow = $true
      try { $p = [System.Diagnostics.Process]::Start($psi) }
      catch { [Console]::Error.WriteLine("could not start the script: $_"); exit 125 }
      if (-not $p.WaitForExit($TimeoutSec * 1000)) {
          & taskkill.exe /T /F /PID $p.Id 2>&1 | Out-Null
          exit 124
      }
      exit $p.ExitCode
      '''))
      LET Argv <= if(condition=IsWin,
          then=[PowerShellExe, '-NoProfile', '-NonInteractive', '-ExecutionPolicy', 'Bypass',
                '-File', WinWrapper, '-Script', ScriptPath, '-StdOut', StdoutPath,
                '-StdErr', StderrPath, '-TimeoutSec', str(str=TimeoutSec)],
          -- Linux: timeout leads its own process group; after the script exits,
          -- whatever it left running in that group is killed too (setsid escapes).
          else=[BashExe, '-c', 'timeout -k 10 "$4" "$0" "$1" <"/dev/null" >"$2" 2>"$3" & p=$!; wait $p; rc=$?; kill -KILL -- -$p 2>/dev/null; exit $rc',
                BashExe, ScriptPath, StdoutPath, StderrPath, str(str=TimeoutSec)])

      -- execve's env REPLACES the environment: pass the client's own (SystemRoot,
      -- PATH, COMPUTERNAME, TEMP...) plus INTACT_OUT, or scripts lose them all.
      -- cwd is OutDir: public scripts write their results to the current folder
      -- and know nothing of INTACT_OUT; stdout / stderr stay in WorkDir.
      LET BaseEnv <= SELECT * FROM environ()
      LET StartTime <= now()
      LET _Log1 <= log(message='Intact.RunScript: %v (sha256 %v) on %v, timeout %vs',
                       args=[TheName, ActualSHA256, OSName, TimeoutSec])
      LET Exec <= if(condition=Runnable,
          then={ SELECT ReturnCode, Stdout, Stderr, Complete
                 FROM execve(argv=Argv, env=BaseEnv[0] + dict(INTACT_OUT=OutDir), cwd=OutDir, length=100000) })
      LET EndTime <= now()
      LET Elapsed <= EndTime - StartTime
      LET Done <= SELECT ReturnCode, Stderr FROM Exec WHERE Complete
      LET ExitCode <= if(condition=Done, then=Done[0].ReturnCode)

      LET StdoutSize <= stat(filename=StdoutPath).Size || 0
      LET StderrSize <= stat(filename=StderrPath).Size || 0
      LET StderrText <= read_file(filename=StderrPath, length=4096) || Done[0].Stderr || ''
      LET StderrTail <= if(condition=StderrSize > 4096,
          then=read_file(filename=StderrPath, offset=StderrSize - 4096, length=4096), else='')

      -- Killed by the wrapper: it ran out its time (124, or 137 when it also
      -- ignored SIGTERM). Judged by the clock, so a script that itself exits 124
      -- is not "timed out".
      LET TimedOut <= Done AND ExitCode in (124, 137) AND Elapsed >= TimeoutSec
      -- Only what really means "something stopped it from running". A plain
      -- "permission denied" from a command the script ran is a Failed with a hint.
      LET Blocked <= ExitCode != 0 AND (StderrText + StderrTail) =~ '(?i)(contains malicious content|contains a virus|potentially unwanted software|blocked by your antivirus|running scripts is disabled|AuthorizationManager check failed)'
      LET Denied <= (StderrText + StderrTail) =~ '(?i)(access is denied|permission denied)'

      LET Status <= if(condition=NOT Supported OR NOT RightOS, then='Skipped',
          else=if(condition=NOT UrlTypeOK, then='NotStarted',
          else=if(condition=NOT TheScript, then='NotStarted',
          else=if(condition=NOT HashOK, then='HashMismatch',
          else=if(condition=NOT Done, then='NotStarted',
          else=if(condition=TimedOut, then='TimedOut',
          else=if(condition=Blocked, then='Blocked',
          else=if(condition=ExitCode = 0, then='Success', else='Failed'))))))))
      LET Hint <= if(condition=NOT Supported, then=format(format='%v is not supported (Windows and Linux only)', args=OSName),
          else=if(condition=NOT RightOS AND TargetOS,
                  then=format(format='TargetOS is %v and this endpoint runs %v: not run', args=[WantOS, OSName]),
          else=if(condition=NOT RightOS,
                  then=format(format='%v is a %v script and this endpoint runs %v: not run', args=[UrlName, WantOS, OSName]),
          else=if(condition=UrlConflict,
                  then=format(format='%v is a %v script but TargetOS is %v: not run', args=[UrlName, UrlOS, TargetOS]),
          else=if(condition=NOT UrlTypeOK,
                  then=format(format='%v is not a .ps1 or .sh script: not run (set TargetOS to run it anyway)', args=UrlName || UrlClean),
          else=if(condition=NOT TheScript, then=DlProblem || 'no script was given (Script or ScriptURL)',
          else=if(condition=NOT HashOK, then='the script does not match ScriptSHA256; it was not run',
          else=if(condition=NOT Done, then=format(format='could not start %v (bad path, execve disabled on this client, or no temp space)', args=if(condition=IsWin, then=PowerShellExe, else=BashExe)),
          else=if(condition=TimedOut, then=format(format='killed after %v s (TimeoutSec)', args=TimeoutSec),
          else=if(condition=Blocked, then='blocked: antivirus/AMSI or execution policy (see StderrHead)',
          else=if(condition=ExitCode != 0 AND Denied, then='a command was denied access (see StderrHead)',
          else=if(condition=ExitCode = 137 OR ExitCode = -1, then='killed by a signal',
          else=if(condition=ExitCode = 0 AND StderrSize > 0, then='exit 0, but the script wrote to stderr (see StderrHead)',
          else=if(condition=ExitCode != 0,
                  then=format(format='the script exited with code %v (see StderrHead)', args=ExitCode),
          else=''))))))))))))))

      LET _Log2 <= log(level=if(condition=Status in ('Success', 'Skipped'), then='DEFAULT', else='WARN'),
                       message='Intact.RunScript: %v exit=%v in %v s. %v',
                       args=[Status, ExitCode, Elapsed, Hint])

      -- The script's output files, by path under INTACT_OUT (a/data.csv and
      -- b/data.csv stay apart). Field names a script's own columns will not
      -- shadow (a CSV with a Name or Type column is common).
      LET OutFiles <= SELECT OSPath AS IntactPath,
             join(array=OSPath.Components[OutDepth:], sep='/') AS IntactFile, Size AS IntactSize,
             -- bare file name: the same CSV from every endpoint shares it, even
             -- when a script puts it under a per-host folder (DFIR-<host>-<date>/).
             Name AS IntactName,
             lowcase(string=if(condition=Name =~ '\\.[^.]+$',
                               then=regex_replace(source=Name, re='^.*\\.', replace=''), else='')) AS IntactExt
        FROM glob(globs='**', root=OutDir, nosymlink=TRUE) WHERE format(format='%v', args=Mode) =~ '^-'

      -- len() of a stored query is 0 once it passes 1000 rows (it spills to
      -- disk): 3000 output files reported OutputFiles 0. Count instead.
      LET OutFileCount <= SELECT count() AS n FROM OutFiles GROUP BY 1

      -- Text of a file as UTF-8, whatever PowerShell wrote: UTF-16 LE (FF FE),
      -- UTF-8 with BOM, or plain. Export-Csv's "#TYPE ..." first line is dropped.
      LET Utf8(Path, Size) = regex_replace(re='^\\x{feff}(#TYPE [^\n]*\n)?|^#TYPE [^\n]*\n', replace='',
          source=if(condition=format(format='%x', args=read_file(filename=Path, length=2)) = 'fffe',
                    then=utf16(string=read_file(filename=Path, length=Size, offset=2)),
                    else=read_file(filename=Path, length=Size)))

      -- Parsed rows of one file; the file is read once per call. A file that
      -- does not parse gives no rows (and a Note), never an error that stops
      -- the other files.
      LET ParseFile(Path, Ext, Size) = SELECT * FROM foreach(
          row={ SELECT Utf8(Path=Path, Size=Size) AS T FROM scope() },
          query={ SELECT * FROM switch(
            a={ SELECT * FROM if(condition=Ext = 'csv',
                  then={ SELECT * FROM parse_csv(filename=T, accessor='data') }) },
            b={ SELECT * FROM if(condition=Ext = 'json' AND T =~ '^\\s*\\[',
                  then={ SELECT * FROM parse_json_array(data=T) }) },
            c={ SELECT * FROM if(condition=Ext = 'json' AND T =~ '^\\s*\\{',
                  then={ SELECT * FROM foreach(row=parse_json(data=T)) }) },
            d={ SELECT * FROM if(condition=Ext = 'jsonl',
                  then={ SELECT * FROM parse_jsonl(filename=T, accessor='data') }) },
            -- many tools write JSON Lines into a .json file: tried when c gave nothing
            e={ SELECT * FROM if(condition=Ext = 'json',
                  then={ SELECT * FROM parse_jsonl(filename=T, accessor='data') }) }) })

      LET Parseable(Ext) = Ext in ('csv', 'json', 'jsonl')
      -- len() of a query is always 0 in VQL; a grouped count() is the row total.
      LET CountRows(Path, Ext, Size) = SELECT count() AS n FROM ParseFile(Path=Path, Ext=Ext, Size=Size) GROUP BY 1

      -- stdout / stderr, capped like any other file (a script printing GBs would
      -- otherwise use up the collection's upload budget).
      LET LogFiles = SELECT * FROM chain(
          a={ SELECT 'File' AS IntactRow, 'stdout.txt' AS IntactName, 'intact/stdout.txt' AS IntactFile, StdoutSize AS Size,
                     'stdout' AS Kind, NULL AS RowsParsed,
                     if(condition=StdoutSize <= MaxBytes,
                        then=upload(file=StdoutPath, name='intact/stdout.txt').sha256) AS UploadedSHA256,
                     if(condition=StdoutSize > MaxBytes,
                        then=format(format='over MaxFileMB (%v MB): not uploaded', args=MaxFileMB), else='') AS Note
              FROM scope() WHERE StdoutSize > 0 },
          b={ SELECT 'File' AS IntactRow, 'stderr.txt' AS IntactName, 'intact/stderr.txt' AS IntactFile, StderrSize AS Size,
                     'stderr' AS Kind, NULL AS RowsParsed,
                     if(condition=StderrSize <= MaxBytes,
                        then=upload(file=StderrPath, name='intact/stderr.txt').sha256) AS UploadedSHA256,
                     if(condition=StderrSize > MaxBytes,
                        then=format(format='over MaxFileMB (%v MB): not uploaded', args=MaxFileMB), else='') AS Note
              FROM scope() WHERE StderrSize > 0 })

      -- One row per output file, evaluated per file so its fields are in scope.
      LET FileRows = SELECT * FROM foreach(row=OutFiles, query={
          SELECT 'File' AS IntactRow, IntactName, IntactFile, IntactSize AS Size, Kind, RowsParsed,
                 UploadedSHA256,
                 if(condition=IntactSize > MaxBytes,
                    then=format(format='over MaxFileMB (%v MB): listed only', args=MaxFileMB),
                 else=if(condition=Kind != 'other' AND IntactSize > 0 AND NOT RowsParsed,
                    then=format(format='no rows parsed (not valid %v, or headers only): uploaded as-is', args=Kind),
                 else='')) AS Note
          FROM foreach(row={
              SELECT if(condition=Parseable(Ext=IntactExt), then=IntactExt, else='other') AS Kind,
                     if(condition=IntactSize <= MaxBytes AND Parseable(Ext=IntactExt),
                        then=CountRows(Path=IntactPath, Ext=IntactExt, Size=IntactSize)[0].n || 0) AS RowsParsed,
                     if(condition=IntactSize <= MaxBytes,
                        then=upload(file=IntactPath, name='out/' + IntactFile).sha256) AS UploadedSHA256
              FROM scope() }) })

      -- The Execution row goes first, then the parsed rows, then the uploads: if a
      -- collection's upload cap is hit, what is lost is uploads, not the table.
      SELECT * FROM chain(
        a={ SELECT 'Execution' AS IntactRow, Status, ExitCode, Hint,
                   timestamp(epoch=StartTime) AS StartTime, timestamp(epoch=EndTime) AS EndTime,
                   Elapsed AS DurationSec,
                   TheName AS ScriptName, UrlClean AS ScriptURL, ActualSHA256 AS ScriptSHA256,
                   ScriptSHA256 AS ExpectedSHA256, OSName AS OS, WantOS AS TargetOS,
                   StdoutSize AS StdoutBytes, StderrSize AS StderrBytes,
                   -- colour codes (testssl.sh, many bash tools) make it unreadable in a table
                   format(format='%.1000s', args=regex_replace(source=StderrText, re='\\x1b\\[[0-9;]*[A-Za-z]', replace='')) AS StderrHead,
                   OutFileCount[0].n || 0 AS OutputFiles
            FROM scope() },
        b={ SELECT * FROM foreach(row=OutFiles,
              query={ SELECT 'Row' AS IntactRow, IntactName, IntactFile, *
                      FROM if(condition=IntactSize <= MaxBytes AND Parseable(Ext=IntactExt),
                              then={ SELECT * FROM ParseFile(Path=IntactPath, Ext=IntactExt, Size=IntactSize) }) }) },
        c={ SELECT * FROM FileRows },
        d={ SELECT * FROM LogFiles })

    # type vql: these cells open by default in every hunt / flow notebook
    # (vql_suggestion only shows them in a menu, so nobody found them).
    notebook:
      - type: vql
        name: Status per endpoint
        template: |
          /*
          # Status per endpoint
          One row per endpoint. Hint explains anything other than a clean Success;
          StderrHead is the start of what the script wrote to stderr.
          */
          SELECT client_info(client_id=ClientId).os_info.hostname AS Hostname,
                 Status, ExitCode, Hint, StartTime, DurationSec, OutputFiles,
                 StdoutBytes, StderrBytes, ScriptName, ScriptURL, StderrHead, ClientId, FlowId
          FROM source() WHERE IntactRow = 'Execution'
          ORDER BY Status
      - type: vql
        name: Rows per file
        template: |
          /*
          # Parsed files (csv / json / jsonl)
          Rows found in each file across all endpoints. Copy a File name into
          ShowFile in the next cell to see just that table.
          */
          LET PerHost = SELECT IntactName, ClientId, count() AS n
            FROM source() WHERE IntactRow = 'Row' GROUP BY IntactName, ClientId
          SELECT IntactName AS File, count() AS Endpoints, sum(item=n) AS Rows
          FROM PerHost GROUP BY IntactName ORDER BY File
      - type: vql
        name: Merged results
        template: |
          /*
          # Merged results
          Every endpoint's parsed rows: the Endpoint, the SourceFile they came
          from, then the file's own columns. If the script wrote several different
          files, set ShowFile to one of them (e.g. 'processes.csv') to see that table alone.
          */
          LET ShowFile = ''
          LET Rows = SELECT * FROM source()
            WHERE IntactRow = 'Row' AND (NOT ShowFile OR IntactName = ShowFile)
          -- rebuild each row without the artifact's bookkeeping columns
          SELECT * FROM foreach(row={
              -- Endpoint / SourceFile, not Hostname / File: DFIR CSVs often have a
              -- File or Hostname column of their own, which would overwrite them.
              SELECT dict(Endpoint=client_info(client_id=_value.ClientId).os_info.hostname,
                          SourceFile=_value.IntactName) +
                     to_dict(item={ SELECT _key, _value FROM items(item=_value)
                                    WHERE NOT _key =~ '^(IntactRow|IntactName|IntactFile|FlowId|ClientId|Fqdn|_OrgId)$' }) AS R
              FROM items(item=Rows) }, column='R')
          ORDER BY SourceFile
      - type: vql
        name: Uploaded files
        template: |
          /*
          # Uploaded files
          Everything each endpoint sent back: the script's console output
          (intact/stdout.txt, intact/stderr.txt) and every file it wrote. Click
          download to save one; Overview -> Download Results zips them all.
          Files that were NOT uploaded (over MaxFileMB) are listed with a Note.
          */
          LET ColumnTypes <= dict(Download='url')
          SELECT * FROM chain(
            -- uploads() with no arguments follows the notebook: the whole hunt, or
            -- this one collection. Passing client_id inside a hunt notebook does
            -- NOT narrow it (HuntId wins), which listed every file once per endpoint.
            a={ SELECT client_info(client_id=_Components[1]).os_info.hostname AS Hostname,
                       regex_replace(source=regex_replace(source=client_path, re='\\\\', replace='/'),
                                     re='^/?(out/)?', replace='') AS File,
                       file_size AS Size,
                       -- relative link: link_to() uses the server's configured URL (http
                       -- here), and Chrome silently blocks an http download from an
                       -- https page, so the button did nothing.
                       regex_replace(source=link_to(upload=Upload, text='download'),
                                     re='\\]\\(https?://[^/]+', replace='](') AS Download, '' AS Note
                FROM uploads() },
            b={ SELECT client_info(client_id=ClientId).os_info.hostname AS Hostname,
                       IntactFile AS File, Size, '' AS Download, Note
                FROM source() WHERE IntactRow = 'File' AND NOT UploadedSHA256 })
          ORDER BY Hostname
